<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Quick Note Taker</title>

    <style>

    /* WORD COUNT */

    #word-count {

        margin-top: 12px;

        font-size: 14px;

        color: #64748b;

        font-weight: bold;

        padding-bottom: 10px;
    }

    /* RESET */

    * {

        margin: 0;

        padding: 0;

        box-sizing: border-box;
    }

    /* BODY */

    body {

        display: flex;

        height: 100vh;

        font-family: 'Segoe UI', sans-serif;

        background: #edf2f7;
    }

    /* SIDEBAR */

    .sidebar {

        width: 280px;

        background: linear-gradient(
            180deg,
            #1e293b,
            #334155
        );

        padding: 15px;

        color: white;

        overflow-y: auto;

        box-shadow: 3px 0 10px rgba(0,0,0,0.1);
    }

    /* NEW NOTE BUTTON */

    .new-note-btn {

        width: 100%;

        padding: 16px;

        border: none;

        border-radius: 14px;

        background: linear-gradient(
            135deg,
            #38bdf8,
            #2563eb
        );

        color: white;

        font-size: 22px;

        font-weight: bold;

        cursor: pointer;

        margin-bottom: 18px;

        transition: 0.2s;
    }

    .new-note-btn:hover {

        transform: scale(1.02);

        opacity: 0.9;
    }

    /* NOTE CARDS */

    .note-item {

        background: rgba(255,255,255,0.08);

        padding: 15px;

        margin-bottom: 14px;

        border-radius: 14px;

        cursor: pointer;

        transition: 0.2s;

        border-left: 5px solid #38bdf8;
    }

    .note-item:hover {

        transform: translateX(5px);

        background: rgba(255,255,255,0.15);
    }

    .note-item strong {

        font-size: 22px;

        display: block;

        margin-bottom: 6px;
    }

    .note-item small {

        color: #d1d5db;
    }

    /* MAIN SECTION */

    .main {

        flex: 1;

        padding: 25px;

        display: flex;

        flex-direction: column;
    }

    /* TITLE INPUT */

    #noteTitle {

        width: 100%;

        padding: 18px;

        font-size: 30px;

        border: none;

        border-radius: 14px;

        margin-bottom: 18px;

        background: white;

        box-shadow: 0 2px 8px rgba(0,0,0,0.08);

        outline: none;
    }

    /* NOTE CONTENT */

    #noteContent {

        width: 100%;

        height: 500px;

        padding: 20px;

        font-size: 22px;

        border: none;

        border-radius: 14px;

        resize: none;

        background: white;

        box-shadow: 0 2px 8px rgba(0,0,0,0.08);

        outline: none;

        line-height: 1.6;
    }

    /* BUTTON SECTION */

    .buttons {

        margin-top: 20px;

        display: flex;

        gap: 15px;

        flex-wrap: wrap;
    }

    /* BUTTONS */

    button {

        padding: 14px 24px;

        border: none;

        border-radius: 12px;

        background: linear-gradient(
            135deg,
            #38bdf8,
            #2563eb
        );

        color: white;

        font-size: 18px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;

        box-shadow: 0 4px 10px rgba(37,99,235,0.2);
    }

    button:hover {

        transform: translateY(-2px);

        opacity: 0.92;
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar {

        width: 8px;
    }

    ::-webkit-scrollbar-thumb {

        background: #64748b;

        border-radius: 20px;
    }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <button
            class="new-note-btn"
            id="newNoteBtn">

            📝 New Note

        </button>

        <div id="notesList"></div>

    </div>

    <!-- MAIN SECTION -->

    <div class="main">

        <input
            type="text"
            id="noteTitle"
            placeholder="Note Title">

        <br>

        <textarea
            id="noteContent"
            placeholder="Write your note..."></textarea>

        <!-- BUTTONS -->

        <div class="buttons">

            <button id="saveBtn">
                💾 Save
            </button>

            <button id="saveAsBtn">
                📁 Save As
            </button>

            <button id="openFileBtn">
                📂 Open File
            </button>

            <button id="deleteBtn">
                🗑 Delete
            </button>

        </div>

        <!-- WORD COUNT -->

        <div id="word-count">
            Words: 0 | Characters: 0
        </div>

    </div>

    <!-- JAVASCRIPT -->

    <script src="renderer.js"></script>

</body>

</html>
